name: Storage portability

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Compile portable disk operations
        run: javac --release 21 -encoding UTF-8 -d build/storage-check src/main/java/io/github/retrocomputers/PortableFiles.java tools/tests/PortableFilesCheck.java
      - name: Check real host filesystem
        run: java -cp build/storage-check io.github.retrocomputers.PortableFilesCheck
